name: flankr_shimmer
description: >-
  Smart skeleton loading for Flutter. Wrap what you'd render once data arrives;
  a shimmering skeleton is measured from it, then content is revealed in place.
version: 0.1.0
repository: https://github.com/amansharma312/flankr-shimmer
issue_tracker: https://github.com/amansharma312/flankr-shimmer/issues

screenshots:
  - description: A list of cards loading, its skeleton measured from the real widgets.
    path: screenshots/light-loading.png
  - description: The same list once loaded; nothing moves when content arrives.
    path: screenshots/light-loaded.png
  - description: The top-to-bottom reveal, slowed down.
    path: screenshots/reveal.gif
  - description: Dark mode, with one shimmer band shared across every skeleton.
    path: screenshots/dark-loading.png
  - description: Dark mode, loaded.
    path: screenshots/dark-loaded.png

topics:
  - skeleton
  - shimmer
  - loading
  - placeholder
  - animation

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
